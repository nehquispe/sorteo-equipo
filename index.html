<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#6c4cff" />
  <meta name="app-version" content="__BUILD_VERSION__" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Sorteo de Grupos</title>
  <link rel="stylesheet" href="styles.css?v=__BUILD_VERSION__" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">♠</span>
      <span><strong>Sorteo de Grupos</strong><small>Organiza, asigna y juega</small></span>
    </div>
    <button class="ghost small" id="resetBtn" type="button">Nueva sesión</button>
  </header>

  <main class="shell">
    <aside class="sidebar" aria-label="Progreso">
      <p class="eyebrow">PREPARACIÓN</p>
      <nav id="stepsNav"></nav>
      <div class="tip"><strong>✦ Consejo</strong><p>Todo se guarda automáticamente en este dispositivo.</p></div>
    </aside>

    <section class="content">
      <div id="app" aria-live="polite"></div>
    </section>
  </main>

  <div class="toast" id="toast" role="status"></div>
  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle"></h2>
      <p id="modalText"></p>
      <div id="modalOptions" class="modal-options"></div>
      <button class="ghost full" id="modalCancel" type="button">Cancelar</button>
    </div>
  </div>

  <input id="ocrFileInput" type="file" accept="image/*" capture="environment" hidden />
  <div class="modal-backdrop" id="ocrModal" hidden>
    <div class="modal ocr-modal" role="dialog" aria-modal="true" aria-labelledby="ocrTitle">
      <div class="ocr-heading">
        <div><h2 id="ocrTitle">Importar desde foto</h2><p id="ocrHelp">Revisa y corrige los nombres antes de importarlos.</p></div>
        <button class="icon-btn" id="ocrClose" type="button" aria-label="Cerrar">×</button>
      </div>
      <div class="ocr-preview-wrap" id="ocrPreviewWrap" hidden><img id="ocrPreview" alt="Foto seleccionada" /></div>
      <div class="ocr-status" id="ocrStatus" hidden>
        <span class="ocr-spinner" aria-hidden="true"></span>
        <div><strong>Reconociendo nombres…</strong><small id="ocrProgress">Preparando imagen</small></div>
      </div>
      <div id="ocrReview" hidden>
        <label class="field-label" for="ocrNames">Un nombre por línea</label>
        <textarea id="ocrNames" rows="10" spellcheck="false" placeholder="1. Julio&#10;2. Marco&#10;3. Ana"></textarea>
        <div class="ocr-summary" id="ocrSummary"></div>
      </div>
      <div class="ocr-actions">
        <button class="ghost" id="ocrRetry" type="button" hidden>Elegir otra foto</button>
        <button class="primary" id="ocrImport" type="button" hidden>Agregar nombres</button>
      </div>
    </div>
  </div>

  <script>
    (async function checkForUpdates() {
      try {
        const current = document.querySelector('meta[name="app-version"]').content;
        const response = await fetch(`version.json?t=${Date.now()}`, { cache: "no-store" });
        const latest = (await response.json()).version;
        const reloadKey = `sorteo-update-${latest}`;
        if (latest && latest !== current && !sessionStorage.getItem(reloadKey)) {
          sessionStorage.setItem(reloadKey, "1");
          const url = new URL(window.location.href);
          url.searchParams.set("v", latest.slice(0, 8));
          window.location.replace(url.toString());
        }
      } catch (_) {
        // Si no hay conexión, la aplicación sigue funcionando con la versión guardada.
      }
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="app.js?v=__BUILD_VERSION__"></script>
</body>
</html>
